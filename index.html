<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Study Index</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #FFFCF2;
    --panel: #FFFFFF;
    --glass: #FFFFFF;
    --glass-strong: #FFFDF0;
    --border: #F2E3A8;
    --border-soft: #F6ECC2;
    --ink: #3A2E14;
    --ink-soft: #8A7B54;
    --ink-faint: #C9BA85;
    --accent: #FFD400;
    --accent-deep: #E0AE00;
    --leaf: #7CB342;
    --danger: #E85D4C;

    --c0: #FFD400;  --c0-bg: #FFF6C2;
    --c1: #7CB342;  --c1-bg: #E7F3D8;
    --c2: #FF9F1C;  --c2-bg: #FFE9CC;
    --c3: #FF6F61;  --c3-bg: #FFE0DC;
    --c4: #52B788;  --c4-bg: #DCF3E8;
    --c5: #5AA9E6;  --c5-bg: #DCEBFA;
  }

  *{ box-sizing: border-box; }

  body{
    margin: 0;
    background: var(--bg);
    background-image:
      radial-gradient(circle at 8% -5%, rgba(255,212,0,0.16), transparent 42%),
      radial-gradient(circle at 95% 10%, rgba(124,179,66,0.10), transparent 40%);
    background-attachment: fixed;
    color: var(--ink);
    font-family: 'Poppins', sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .app{
    max-width: 900px;
    margin: 0 auto;
    padding: 3rem 1.5rem 4rem;
  }

  .top-bar{
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 1.8rem;
  }
  .sem-nav{
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding-bottom: 4px;
  }
  .sem-pill{
    flex-shrink: 0;
    background: var(--panel);
    border: 1.5px solid var(--border);
    color: var(--ink-soft);
    font-weight: 600;
    font-size: 0.82rem;
    padding: 7px 16px;
    border-radius: 999px;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.15s ease;
  }
  .sem-pill:hover{ border-color: var(--accent-deep); color: var(--ink); }
  .sem-pill.active{
    background: var(--accent);
    border-color: var(--accent-deep);
    color: #3A2E14;
  }
  .cal-btn{
    flex-shrink: 0;
    background: var(--panel);
    border: 1.5px solid var(--border);
    color: var(--ink-soft);
    font-weight: 600;
    font-size: 0.82rem;
    padding: 7px 14px;
    border-radius: 999px;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.15s ease;
  }
  .cal-btn:hover{ border-color: var(--accent-deep); color: var(--ink); }
  .cal-btn.active{
    background: var(--ink);
    border-color: var(--ink);
    color: #fff;
  }

  .continue-banner{
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    background: var(--c0-bg);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 0.85rem 1.1rem;
    margin-bottom: 1.6rem;
    cursor: pointer;
    text-align: left;
    transition: border-color 0.15s ease;
  }
  .continue-banner:hover{ border-color: var(--accent-deep); }
  .continue-label{
    font-size: 0.72rem;
    font-weight: 600;
    color: var(--ink-soft);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    display: block;
    margin-bottom: 3px;
  }
  .continue-name{
    font-size: 0.98rem;
    font-weight: 700;
    color: var(--ink);
  }

  .card-due{
    font-size: 0.72rem;
    font-weight: 600;
    color: var(--danger);
  }

  .search-wrap{ margin-bottom: 12px; }
  .search-input{
    width: 100%;
    font-family: 'Poppins', sans-serif;
    font-size: 0.9rem;
    padding: 9px 14px;
    border: 1.5px solid var(--border);
    background: var(--panel);
    color: var(--ink);
    border-radius: 999px;
    box-sizing: border-box;
  }
  .search-input:focus{ outline: none; border-color: var(--accent); }

  .overview-list{
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .overview-row{
    display: grid;
    grid-template-columns: 130px 1fr 44px;
    align-items: center;
    gap: 14px;
    background: var(--glass);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 0.9rem 1.1rem;
    cursor: pointer;
    text-align: left;
    transition: border-color 0.15s ease;
  }
  .overview-row:hover{ border-color: var(--accent-deep); }
  .overview-row-name{ font-weight: 600; font-size: 0.92rem; color: var(--ink); }
  .overview-row-track{
    height: 6px;
    background: var(--border);
    border-radius: 3px;
    overflow: hidden;
  }
  .overview-row-fill{ height: 100%; background: var(--accent); }
  .overview-row-pct{ font-size: 0.8rem; font-weight: 600; color: var(--ink-soft); text-align: right; }

  /* ---------- Calendar ---------- */
  .cal-wrap{
    background: var(--glass);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 1rem 1.1rem 1.2rem;
    margin-bottom: 1rem;
  }
  .cal-head{
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 0.8rem;
  }
  .cal-nav-btn{
    background: var(--panel);
    border: 1px solid var(--border);
    width: 30px;
    height: 30px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 0.9rem;
    color: var(--ink-soft);
  }
  .cal-nav-btn:hover{ border-color: var(--accent-deep); color: var(--ink); }
  .cal-month-label{ font-weight: 700; font-size: 0.98rem; color: var(--ink); }

  .cal-grid{
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
  }
  .cal-dow{ margin-bottom: 4px; }
  .cal-dow-cell{
    text-align: center;
    font-size: 0.68rem;
    font-weight: 600;
    color: var(--ink-faint);
    padding-bottom: 2px;
  }
  .cal-cell{
    min-height: 46px;
    border-radius: 8px;
    padding: 4px 4px;
    background: var(--panel);
  }
  .cal-cell.blank{ background: transparent; }
  .cal-cell.today{ background: var(--c0-bg); border: 1px solid var(--accent-deep); }
  .cal-daynum{ font-size: 0.72rem; font-weight: 600; color: var(--ink-soft); }
  .cal-dots{ display: flex; flex-wrap: wrap; gap: 3px; margin-top: 3px; }
  .cal-dot{
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--dot-color, var(--accent));
    display: inline-block;
  }
  .cal-dot.ring{
    background: transparent;
    border: 2px solid var(--dot-color, var(--accent));
    width: 6px; height: 6px;
  }

  .cal-legend{
    display: flex;
    gap: 18px;
    font-size: 0.76rem;
    color: var(--ink-soft);
    margin-bottom: 1.4rem;
  }
  .cal-legend span{ display: inline-flex; align-items: center; gap: 6px; }

  .add-assignment-toggle{
    background: var(--accent);
    border: none;
    color: #3A2E14;
    font-weight: 700;
    font-size: 0.85rem;
    padding: 9px 18px;
    border-radius: 999px;
    cursor: pointer;
    margin-bottom: 1rem;
  }
  .add-assignment-toggle:hover{ background: var(--accent-deep); }

  .add-assignment-holder{
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.2s ease;
  }
  .add-assignment-holder.open{ max-height: 400px; margin-bottom: 1.4rem; }

  .add-assignment-form{
    background: var(--glass);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 1rem 1.1rem;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .add-assignment-form select,
  .add-assignment-form input,
  .add-assignment-form textarea{
    font-family: 'Poppins', sans-serif;
    font-size: 0.88rem;
    padding: 8px 10px;
    border: 1.5px solid var(--border);
    background: var(--panel);
    color: var(--ink);
    border-radius: 8px;
  }
  .assignment-desc-input{
    resize: vertical;
    min-height: 60px;
  }
  .type-toggle{ display: flex; gap: 8px; }
  .type-pill{
    flex: 1;
    background: var(--panel);
    border: 1.5px solid var(--border);
    color: var(--ink-soft);
    font-weight: 600;
    font-size: 0.82rem;
    padding: 8px 10px;
    border-radius: 8px;
    cursor: pointer;
  }
  .type-pill.active{
    background: var(--accent);
    border-color: var(--accent-deep);
    color: #3A2E14;
  }
  .add-assignment-submit{
    background: var(--ink);
    color: #fff;
    border: none;
    font-weight: 700;
    font-size: 0.85rem;
    padding: 9px 14px;
    border-radius: 8px;
    cursor: pointer;
  }

  .assignment-list{
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .assignment-card{
    background: var(--glass);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 0.65rem 0.9rem;
  }
  .assignment-row{
    display: grid;
    grid-template-columns: 8px auto 1fr auto auto auto;
    align-items: center;
    gap: 10px;
  }
  .assignment-dot{
    width: 8px; height: 8px;
    border-radius: 50%;
  }
  .assignment-subject{
    font-size: 0.72rem;
    font-weight: 600;
    color: var(--ink-soft);
    white-space: nowrap;
  }
  .assignment-title{
    font-size: 0.88rem;
    font-weight: 600;
    color: var(--ink);
    text-align: left;
  }
  button.assignment-title.clickable{
    background: none;
    border: none;
    cursor: pointer;
    padding: 0;
    font-family: 'Poppins', sans-serif;
  }
  button.assignment-title.clickable:hover{ color: var(--accent-deep); }
  .assignment-desc{
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px dashed var(--border);
    font-size: 0.82rem;
    line-height: 1.55;
    color: var(--ink-soft);
    white-space: pre-wrap;
  }
  .assignment-badge{
    font-size: 0.68rem;
    font-weight: 700;
    padding: 3px 9px;
    border-radius: 999px;
    white-space: nowrap;
  }
  .badge-individual{ background: var(--border-soft); color: var(--ink-soft); }
  .badge-group{ background: #E9DBFF; color: #6B3FA0; }
  .assignment-date{
    font-size: 0.78rem;
    font-weight: 600;
    color: var(--ink-soft);
    white-space: nowrap;
  }
  .assignment-date.overdue{ color: var(--danger); }
  .assignment-del{
    background: none;
    border: none;
    color: var(--ink-faint);
    font-size: 1.1rem;
    cursor: pointer;
    line-height: 1;
    padding: 0 2px;
  }
  .assignment-del:hover{ color: var(--danger); }

  /* ---------- Home hero ---------- */
  .hero{
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1.5rem;
    margin-bottom: 2.4rem;
    flex-wrap: wrap;
  }

  .hero-text .eyebrow{
    font-size: 0.8rem;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--accent-deep);
    margin-bottom: 8px;
  }
  .hero-text h1{
    font-size: 2.1rem;
    font-weight: 800;
    margin: 0 0 8px;
    letter-spacing: -0.01em;
    color: var(--ink);
  }
  .hero-text p{
    margin: 0;
    color: var(--ink-soft);
    font-size: 0.96rem;
    max-width: 40ch;
  }

  .ring{
    --pct: 0;
    width: 96px;
    height: 96px;
    border-radius: 50%;
    background: conic-gradient(var(--accent) calc(var(--pct) * 3.6deg), var(--border) 0deg);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    flex-shrink: 0;
    filter: drop-shadow(0 6px 18px rgba(255,212,0,0.35));
  }
  .ring::before{
    content: "";
    position: absolute;
    inset: 8px;
    border-radius: 50%;
    background: var(--bg);
  }
  .ring .ring-label{
    position: relative;
    z-index: 1;
    text-align: center;
  }
  .ring .ring-pct{
    font-size: 1.2rem;
    font-weight: 700;
    display: block;
    line-height: 1.1;
    color: var(--ink);
  }
  .ring .ring-sub{
    font-size: 0.62rem;
    color: var(--ink-soft);
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  .ring-sm{
    --pct: 0;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: conic-gradient(var(--ring-color, var(--accent)) calc(var(--pct) * 3.6deg), var(--border) 0deg);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    flex-shrink: 0;
  }
  .ring-sm::before{
    content: "";
    position: absolute;
    inset: 4px;
    border-radius: 50%;
    background: var(--panel);
  }
  .ring-sm span{
    position: relative;
    z-index: 1;
    font-size: 0.64rem;
    font-weight: 600;
    color: var(--ink-soft);
  }

  /* ---------- Subject grid ---------- */
  .grid{
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
    gap: 14px;
  }

  .card{
    background: var(--glass);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 1.2rem;
    cursor: pointer;
    text-align: left;
    display: flex;
    flex-direction: column;
    gap: 14px;
    transition: transform 0.16s ease, border-color 0.16s ease, box-shadow 0.16s ease;
    box-shadow: 0 2px 10px rgba(58,46,20,0.04);
  }
  .card:hover{
    transform: translateY(-3px);
    border-color: var(--card-color, var(--accent));
    box-shadow: 0 10px 24px rgba(58,46,20,0.08);
  }

  .card-top{
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .card-icon{
    width: 42px;
    height: 42px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.25rem;
    background: var(--card-bg, #FFF6C2);
  }

  .card-name{
    font-size: 1.02rem;
    font-weight: 600;
    color: var(--ink);
    margin: 0 0 4px;
  }
  .card-meta{
    font-size: 0.78rem;
    color: var(--ink-soft);
    font-weight: 500;
  }

  /* ---------- Subject detail view ---------- */
  .back-btn{
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: none;
    border: none;
    color: var(--ink-soft);
    font-weight: 600;
    font-size: 0.85rem;
    cursor: pointer;
    padding: 0;
    margin-bottom: 1.6rem;
  }
  .back-btn:hover{ color: var(--accent-deep); }

  .subject-head{
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    margin-bottom: 1.6rem;
    flex-wrap: wrap;
  }
  .subject-head-left{
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .subject-head .card-icon{ width: 48px; height: 48px; font-size: 1.4rem; }
  .subject-head h2{
    font-size: 1.4rem;
    font-weight: 700;
    margin: 0 0 4px;
    color: var(--ink);
  }
  .subject-head .subject-sub{
    font-size: 0.8rem;
    color: var(--ink-soft);
    font-weight: 500;
  }

  .topics{
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .topic-card{
    background: var(--glass);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 1rem 1.1rem;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
    box-shadow: 0 1px 6px rgba(58,46,20,0.03);
  }
  .topic-card:hover{ border-color: var(--accent); box-shadow: 0 6px 16px rgba(58,46,20,0.06); }
  .topic-card.done{ opacity: 0.6; }

  .topic-row{
    display: grid;
    grid-template-columns: 26px 1fr auto;
    align-items: start;
    gap: 12px;
  }

  .check{
    width: 22px;
    height: 22px;
    margin-top: 1px;
    border: 1.5px solid var(--border);
    background: var(--panel);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    border-radius: 50%;
    color: transparent;
    font-size: 0.7rem;
    font-weight: 700;
    transition: all 0.15s ease;
  }
  .check.checked{
    background: var(--accent);
    border-color: var(--accent);
    color: #3A2E14;
    box-shadow: 0 0 0 4px var(--c0-bg);
  }

  .topic-main a{
    color: var(--ink);
    text-decoration: none;
    font-weight: 600;
    font-size: 0.98rem;
  }
  .topic-main a:hover{ color: var(--accent-deep); }
  .topic-card.done .topic-main a{ text-decoration: line-through; text-decoration-color: var(--ink-faint); }

  .topic-main .no-link{ font-weight: 600; font-size: 0.98rem; }

  .topic-main .notes{
    font-size: 0.78rem;
    color: var(--ink-soft);
    margin-top: 5px;
    line-height: 1.5;
    font-weight: 500;
  }

  .topic-actions{
    display: flex;
    gap: 6px;
    align-self: start;
  }

  button.pill-btn{
    background: var(--c0-bg);
    border: 1px solid var(--border);
    color: var(--ink);
    font-weight: 600;
    font-size: 0.72rem;
    cursor: pointer;
    padding: 5px 11px;
    border-radius: 999px;
    transition: background 0.15s ease, border-color 0.15s ease;
    white-space: nowrap;
  }
  button.pill-btn:hover{
    background: var(--accent);
    border-color: var(--accent-deep);
  }

  .preview-wrap{
    margin: 14px 0 2px 38px;
    border: 1px solid var(--border);
    background: var(--bg);
    border-radius: 12px;
    overflow: hidden;
  }
  .preview-wrap iframe{
    width: 100%;
    height: 360px;
    border: none;
    display: block;
  }

  .empty{
    padding: 2.6rem 1rem;
    text-align: center;
    color: var(--ink-soft);
    font-size: 0.92rem;
    border: 1.5px dashed var(--border);
    border-radius: 16px;
  }
  .empty .big{
    font-size: 1rem;
    font-weight: 600;
    color: var(--ink);
    margin-bottom: 6px;
  }
  .empty .big::before{ content: "🍋 "; }

  .status{
    font-size: 0.85rem;
    color: var(--ink-soft);
    padding: 3rem 0;
    text-align: center;
  }

  @media (max-width: 680px){
    .app{ padding: 2.2rem 1.1rem 3rem; }
    .hero{ flex-direction: column; align-items: flex-start; gap: 1.2rem; }
    .hero-text h1{ font-size: 1.7rem; }
    .grid{ grid-template-columns: 1fr 1fr; }
    .topic-row{ grid-template-columns: 22px 1fr; row-gap: 10px; }
    .topic-actions{
      grid-column: 1 / -1;
      flex-wrap: wrap;
      margin-left: 34px;
    }
    .preview-wrap{ margin-left: 0; }
    .preview-wrap iframe{ height: 260px; }

    .top-bar{ flex-direction: column; align-items: stretch; gap: 10px; }
    .cal-btn{ align-self: flex-start; }
    .overview-row{ grid-template-columns: 1fr; row-gap: 6px; }
    .overview-row-pct{ text-align: left; }
    .assignment-row{
      grid-template-columns: 8px 1fr auto;
      row-gap: 6px;
    }
    .assignment-subject{ grid-column: 2 / 3; }
    .assignment-title{ grid-column: 2 / 3; }
    .assignment-badge{ grid-column: 2 / 3; justify-self: start; }
    .assignment-date{ grid-column: 2 / 3; }
  }
  @media (max-width: 420px){
    .grid{ grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div class="app" id="app">
  <div class="status">Loading your subjects…</div>
</div>

<script>
const CLOUD_STORAGE = (typeof window !== 'undefined' && window.storage && typeof window.storage.get === 'function');

async function storageGet(key){
  if(CLOUD_STORAGE){
    return await window.storage.get(key, false);
  }
  const raw = localStorage.getItem(key);
  return raw ? { value: raw } : null;
}

async function storageSet(key, value){
  if(CLOUD_STORAGE){
    return await window.storage.set(key, value, false);
  }
  localStorage.setItem(key, value);
  return { value };
}

function uid(){ return Math.random().toString(36).slice(2, 10); }

const SUBJECT_META = [
  { name: 'Intro to Mass Comm', icon: '📡', color: 'c0' },
  { name: 'Graphic Comm', icon: '🎨', color: 'c1' },
  { name: 'English for Academic Purposes', icon: '✍️', color: 'c2' },
  { name: 'Comm Theory and Practice', icon: '🧠', color: 'c3' },
  { name: 'Writing for Mass Media', icon: '📰', color: 'c4' },
  { name: 'Creativity Thinking', icon: '💡', color: 'c5' }
];

const SEED_SLIDES = {
  0: [

    { title: 'Topic 10_Mass Communication', url: 'https://drive.google.com/file/d/1urgYJO8nxvW8pC-nXo7QPUoHOCu4ErKc/view?usp=sharing', notes: 'Agenda-Setting; Cultivation Theory',
      summary: 'This topic wraps up with theories about how mass media affects large audiences and society.\nAgenda-Setting: media may not tell people exactly what to think, but it strongly influences what topics people think about.\nCultivation Theory: heavy, long-term exposure to media, especially TV, can shape a person\'s overall view of what the real world is like.\nBoth explain media\'s slower, broader influence on public perception rather than instant persuasion.' }

const GENERIC_COLORS = ['c0', 'c1', 'c2', 'c3', 'c4'];

function buildSemesterSubjects(semIndex){
  if(semIndex === 0){
    return SUBJECT_META.map((meta, i) => ({
      id: uid(),
      name: meta.name,
      icon: meta.icon,
      color: meta.color,
      slides: (SEED_SLIDES[i] || []).map(s => ({
        id: uid(),
        title: s.title,
        url: s.url,
        notes: s.notes || '',
        summary: s.summary || '',
        reviewed: false
      }))
    }));
  }
  return Array.from({ length: 5 }, (_, i) => ({
    id: uid(),
    name: 'Subject ' + (i + 1),
    icon: '📘',
    color: GENERIC_COLORS[i % GENERIC_COLORS.length],
    slides: []
  }));
}

function defaultData(){
  return {
    semesters: Array.from({ length: 6 }, (_, i) => ({
      id: uid(),
      name: 'Semester ' + (i + 1),
      subjects: buildSemesterSubjects(i)
    })),
    assignments: [],
    lastTouched: null
  };
}

let data = null;
let semIndex = 0;
let view = 'home';
let searchQuery = '';
let calMonthDate = new Date();
const expanded = new Set();
const assignmentDescExpanded = new Set();

function currentSemester(){
  return data.semesters[semIndex];
}

async function load(){
  try{
    const res = await storageGet('study-data');
    data = res && res.value ? JSON.parse(res.value) : defaultData();
    if(!data.assignments) data.assignments = [];
    if(data.lastTouched === undefined) data.lastTouched = null;
  }catch(e){
    data = defaultData();
  }
  render();
}

async function save(){
  try{
    await storageSet('study-data', JSON.stringify(data));
  }catch(e){
    console.error('Could not save', e);
  }
}

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

function embedUrl(url){
  if(!url) return null;
  let m = url.match(/docs\.google\.com\/presentation\/d\/([a-zA-Z0-9_-]+)/);
  if(m) return 'https://docs.google.com/presentation/d/' + m[1] + '/embed?start=false&loop=false&delayms=3000';
  m = url.match(/docs\.google\.com\/document\/d\/([a-zA-Z0-9_-]+)/);
  if(m) return 'https://docs.google.com/document/d/' + m[1] + '/preview';
  m = url.match(/drive\.google\.com\/file\/d\/([a-zA-Z0-9_-]+)/);
  if(m) return 'https://drive.google.com/file/d/' + m[1] + '/preview';
  m = url.match(/drive\.google\.com\/open\?id=([a-zA-Z0-9_-]+)/);
  if(m) return 'https://drive.google.com/file/d/' + m[1] + '/preview';
  if(/\.pdf($|\?)/i.test(url)) return url;
  if(/onedrive\.live\.com|1drv\.ms|sharepoint\.com/i.test(url)) return url;
  return 'https://docs.google.com/viewer?embedded=true&url=' + encodeURIComponent(url);
}

function subjectStats(sub){
  const total = sub.slides.length;
  const done = sub.slides.filter(x => x.reviewed).length;
  const pct = total ? Math.round((done / total) * 100) : 0;
  return { total, done, pct };
}

function todayISO(){
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

function formatDateLabel(iso){
  const [y,m,d] = iso.split('-').map(Number);
  const dt = new Date(y, m-1, d);
  return dt.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
}

function semesterAssignments(){
  return data.assignments.filter(a => a.semIndex === semIndex);
}

function findSubject(semI, subId){
  const sem = data.semesters[semI];
  return sem ? sem.subjects.find(s => s.id === subId) : null;
}

function renderTopBar(){
  const bar = document.createElement('div');
  bar.className = 'top-bar';

  const nav = document.createElement('div');
  nav.className = 'sem-nav';
  data.semesters.forEach((sem, i) => {
    const pill = document.createElement('button');
    pill.className = 'sem-pill' + (view !== 'overview' && i === semIndex ? ' active' : '');
    pill.textContent = 'Sem ' + (i + 1);
    pill.addEventListener('click', () => {
      semIndex = i;
      view = 'home';
      render();
      window.scrollTo(0,0);
    });
    nav.appendChild(pill);
  });
  const overviewPill = document.createElement('button');
  overviewPill.className = 'sem-pill' + (view === 'overview' ? ' active' : '');
  overviewPill.textContent = 'All';
  overviewPill.addEventListener('click', () => { view = 'overview'; render(); window.scrollTo(0,0); });
  nav.appendChild(overviewPill);
  bar.appendChild(nav);

  const calBtn = document.createElement('button');
  calBtn.className = 'cal-btn' + (view === 'calendar' ? ' active' : '');
  calBtn.textContent = '📅 Calendar';
  calBtn.addEventListener('click', () => { view = 'calendar'; render(); window.scrollTo(0,0); });
  bar.appendChild(calBtn);

  return bar;
}

function render(){
  const app = document.getElementById('app');
  app.innerHTML = '';
  app.appendChild(renderTopBar());

  if(view === 'overview'){
    app.appendChild(renderOverview());
    return;
  }
  if(view === 'calendar'){
    app.appendChild(renderCalendar());
    return;
  }

  const subjects = currentSemester().subjects;
  if(view === 'home'){
    app.appendChild(renderHome(subjects));
  } else {
    const sub = subjects.find(s => s.id === view);
    if(!sub){ view = 'home'; app.appendChild(renderHome(subjects)); return; }
    app.appendChild(renderSubject(sub));
  }
}

function renderOverview(){
  const frag = document.createDocumentFragment();

  const hero = document.createElement('div');
  hero.className = 'hero';
  hero.innerHTML =
    '<div class="hero-text">' +
      '<div class="eyebrow">🍋 All semesters</div>' +
      '<h1>Your progress at a glance.</h1>' +
      '<p>Tap a semester to jump in.</p>' +
    '</div>';
  frag.appendChild(hero);

  const list = document.createElement('div');
  list.className = 'overview-list';
  data.semesters.forEach((sem, i) => {
    const total = sem.subjects.reduce((s, sub) => s + sub.slides.length, 0);
    const done = sem.subjects.reduce((s, sub) => s + sub.slides.filter(x => x.reviewed).length, 0);
    const pct = total ? Math.round((done/total)*100) : 0;

    const row = document.createElement('button');
    row.className = 'overview-row';
    row.innerHTML =
      '<div class="overview-row-name">' + escapeHtml(sem.name) + '</div>' +
      '<div class="overview-row-track"><div class="overview-row-fill" style="width:' + pct + '%"></div></div>' +
      '<div class="overview-row-pct">' + (total ? pct + '%' : '—') + '</div>';
    row.addEventListener('click', () => { semIndex = i; view = 'home'; render(); window.scrollTo(0,0); });
    list.appendChild(row);
  });
  frag.appendChild(list);
  return frag;
}

function renderHome(subjects){
  const frag = document.createDocumentFragment();

  const totalAll = subjects.reduce((s, sub) => s + sub.slides.length, 0);
  const doneAll = subjects.reduce((s, sub) => s + sub.slides.filter(x => x.reviewed).length, 0);
  const pctAll = totalAll ? Math.round((doneAll / totalAll) * 100) : 0;

  const hero = document.createElement('div');
  hero.className = 'hero';
  hero.innerHTML =
    '<div class="hero-text">' +
      '<div class="eyebrow">🍋 ' + escapeHtml(currentSemester().name) + '</div>' +
      '<h1>Ready when you are.</h1>' +
      '<p>' + (totalAll ? (doneAll + ' of ' + totalAll + ' topics reviewed across your subjects.') : 'Pick a subject below to start reviewing.') + '</p>' +
    '</div>';
  const ring = document.createElement('div');
  ring.className = 'ring';
  ring.style.setProperty('--pct', pctAll);
  ring.innerHTML = '<div class="ring-label"><span class="ring-pct">' + pctAll + '%</span><span class="ring-sub">done</span></div>';
  hero.appendChild(ring);
  frag.appendChild(hero);

  const lt = data.lastTouched;
  if(lt && lt.semIndex === semIndex){
    const sub = findSubject(lt.semIndex, lt.subjectId);
    if(sub){
      const banner = document.createElement('button');
      banner.className = 'continue-banner';
      banner.innerHTML =
        '<span class="continue-label">Continue where you left off</span>' +
        '<span class="continue-name">' + sub.icon + '&nbsp; ' + escapeHtml(sub.name) + ' →</span>';
      banner.addEventListener('click', () => { view = sub.id; render(); window.scrollTo(0,0); });
      frag.appendChild(banner);
    }
  }

  const grid = document.createElement('div');
  grid.className = 'grid';

  subjects.forEach(sub => {
    const { total, done, pct } = subjectStats(sub);
    const dueSoonCount = semesterAssignments().filter(a => {
      if(a.subjectId !== sub.id) return false;
      const days = (new Date(a.dueDate) - new Date(todayISO())) / 86400000;
      return days >= 0 && days <= 7;
    }).length;

    const card = document.createElement('button');
    card.className = 'card';
    card.style.setProperty('--card-color', 'var(--' + sub.color + ')');
    card.style.setProperty('--card-bg', 'var(--' + sub.color + '-bg)');

    const top = document.createElement('div');
    top.className = 'card-top';
    const icon = document.createElement('div');
    icon.className = 'card-icon';
    icon.textContent = sub.icon;
    top.appendChild(icon);

    const r = document.createElement('div');
    r.className = 'ring-sm';
    r.style.setProperty('--pct', pct);
    r.style.setProperty('--ring-color', 'var(--' + sub.color + ')');
    r.innerHTML = '<span>' + pct + '%</span>';
    top.appendChild(r);
    card.appendChild(top);

    const nameEl = document.createElement('div');
    nameEl.className = 'card-name';
    nameEl.textContent = sub.name;
    card.appendChild(nameEl);

    const meta = document.createElement('div');
    meta.className = 'card-meta';
    meta.textContent = total ? (done + ' / ' + total + ' reviewed') : 'no content yet';
    card.appendChild(meta);

    if(dueSoonCount > 0){
      const due = document.createElement('div');
      due.className = 'card-due';
      due.textContent = '📌 ' + dueSoonCount + ' due soon';
      card.appendChild(due);
    }

    card.addEventListener('click', () => {
      view = sub.id;
      data.lastTouched = { semIndex, subjectId: sub.id };
      save();
      render();
      window.scrollTo(0,0);
    });
    grid.appendChild(card);
  });

  frag.appendChild(grid);
  return frag;
}

function renderSubject(sub){
  const frag = document.createDocumentFragment();
  const { total, done, pct } = subjectStats(sub);

  const back = document.createElement('button');
  back.className = 'back-btn';
  back.textContent = '← All subjects';
  back.addEventListener('click', () => { view = 'home'; searchQuery = ''; render(); window.scrollTo(0,0); });
  frag.appendChild(back);

  const head = document.createElement('div');
  head.className = 'subject-head';
  const left = document.createElement('div');
  left.className = 'subject-head-left';
  const icon = document.createElement('div');
  icon.className = 'card-icon';
  icon.style.setProperty('--card-bg', 'var(--' + sub.color + '-bg)');
  icon.textContent = sub.icon;
  left.appendChild(icon);
  const titleWrap = document.createElement('div');
  titleWrap.innerHTML =
    '<h2>' + escapeHtml(sub.name) + '</h2>' +
    '<div class="subject-sub">' + (total ? (done + ' / ' + total + ' reviewed') : 'no content yet') + '</div>';
  left.appendChild(titleWrap);
  head.appendChild(left);

  const r = document.createElement('div');
  r.className = 'ring-sm';
  r.style.setProperty('--pct', pct);
  r.style.setProperty('--ring-color', 'var(--' + sub.color + ')');
  r.innerHTML = '<span>' + pct + '%</span>';
  head.appendChild(r);

  frag.appendChild(head);

  if(total === 0){
    const empty = document.createElement('div');
    empty.className = 'empty';
    empty.innerHTML = '<div class="big">No content for now</div>Slides for this subject will be added soon.';
    frag.appendChild(empty);
    return frag;
  }

  if(total > 4){
    const searchWrap = document.createElement('div');
    searchWrap.className = 'search-wrap';
    const input = document.createElement('input');
    input.className = 'search-input';
    input.placeholder = '🔍 Search topics…';
    input.value = searchQuery;
    input.addEventListener('input', () => {
      searchQuery = input.value;
      render();
      const el = document.querySelector('.search-input');
      if(el){ el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
    });
    searchWrap.appendChild(input);
    frag.appendChild(searchWrap);
  }

  const q = searchQuery.trim().toLowerCase();
  const visibleSlides = q ? sub.slides.filter(s => s.title.toLowerCase().includes(q)) : sub.slides;

  if(visibleSlides.length === 0){
    const empty = document.createElement('div');
    empty.className = 'empty';
    empty.innerHTML = '<div class="big">No matches</div>Try a different search term.';
    frag.appendChild(empty);
    return frag;
  }

  const list = document.createElement('ul');
  list.className = 'topics';

  visibleSlides.forEach(slide => {
    const li = document.createElement('li');
    li.className = 'topic-card' + (slide.reviewed ? ' done' : '');

    const row = document.createElement('div');
    row.className = 'topic-row';

    const check = document.createElement('button');
    check.className = 'check' + (slide.reviewed ? ' checked' : '');
    check.setAttribute('aria-label', slide.reviewed ? 'Mark as not reviewed' : 'Mark as reviewed');
    check.textContent = '✓';
    check.addEventListener('click', () => {
      slide.reviewed = !slide.reviewed;
      data.lastTouched = { semIndex, subjectId: sub.id };
      save();
      render();
    });
    row.appendChild(check);

    const main = document.createElement('div');
    main.className = 'topic-main';
    if(slide.url){
      const a = document.createElement('a');
      a.href = slide.url;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      a.textContent = slide.title;
      main.appendChild(a);
    } else {
      const span = document.createElement('span');
      span.className = 'no-link';
      span.textContent = slide.title;
      main.appendChild(span);
    }
    if(slide.notes){
      const notes = document.createElement('div');
      notes.className = 'notes';
      notes.textContent = slide.notes;
      main.appendChild(notes);
    }
    row.appendChild(main);

    const actions = document.createElement('div');
    actions.className = 'topic-actions';

    if(slide.url){
      const viewBtn = document.createElement('button');
      viewBtn.className = 'pill-btn';
      viewBtn.textContent = expanded.has(slide.id) ? 'Hide' : 'Preview';
      viewBtn.addEventListener('click', () => {
        if(expanded.has(slide.id)) expanded.delete(slide.id);
        else expanded.add(slide.id);
        data.lastTouched = { semIndex, subjectId: sub.id };
        save();
        render();
      });
      actions.appendChild(viewBtn);
    }

    row.appendChild(actions);
    li.appendChild(row);

    if(expanded.has(slide.id) && slide.url){
      const wrap = document.createElement('div');
      wrap.className = 'preview-wrap';
      const iframe = document.createElement('iframe');
      iframe.src = embedUrl(slide.url);
      iframe.setAttribute('allow', 'fullscreen');
      iframe.setAttribute('loading', 'lazy');
      wrap.appendChild(iframe);
      li.appendChild(wrap);
    }

    list.appendChild(li);
  });

  frag.appendChild(list);
  return frag;
}

function renderCalendar(){
  const frag = document.createDocumentFragment();

  const hero = document.createElement('div');
  hero.className = 'hero';
  hero.innerHTML =
    '<div class="hero-text">' +
      '<div class="eyebrow">📅 ' + escapeHtml(currentSemester().name) + '</div>' +
      '<h1>Assignments</h1>' +
      '<p>Keep track of what\'s due, and whether it\'s solo or a group job.</p>' +
    '</div>';
  frag.appendChild(hero);

  const subjects = currentSemester().subjects;
  const year = calMonthDate.getFullYear();
  const month = calMonthDate.getMonth();
  const monthLabel = calMonthDate.toLocaleDateString(undefined, { month: 'long', year: 'numeric' });

  const calWrap = document.createElement('div');
  calWrap.className = 'cal-wrap';

  const calHead = document.createElement('div');
  calHead.className = 'cal-head';
  const prevBtn = document.createElement('button');
  prevBtn.className = 'cal-nav-btn';
  prevBtn.textContent = '←';
  prevBtn.addEventListener('click', () => { calMonthDate = new Date(year, month - 1, 1); render(); });
  const nextBtn = document.createElement('button');
  nextBtn.className = 'cal-nav-btn';
  nextBtn.textContent = '→';
  nextBtn.addEventListener('click', () => { calMonthDate = new Date(year, month + 1, 1); render(); });
  const label = document.createElement('div');
  label.className = 'cal-month-label';
  label.textContent = monthLabel;
  calHead.appendChild(prevBtn);
  calHead.appendChild(label);
  calHead.appendChild(nextBtn);
  calWrap.appendChild(calHead);

  const dowRow = document.createElement('div');
  dowRow.className = 'cal-grid cal-dow';
  ['Mo','Tu','We','Th','Fr','Sa','Su'].forEach(d => {
    const c = document.createElement('div');
    c.className = 'cal-dow-cell';
    c.textContent = d;
    dowRow.appendChild(c);
  });
  calWrap.appendChild(dowRow);

  const firstOfMonth = new Date(year, month, 1);
  let startOffset = firstOfMonth.getDay() - 1;
  if(startOffset < 0) startOffset = 6;
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const semAssignments = semesterAssignments();

  const grid = document.createElement('div');
  grid.className = 'cal-grid';
  for(let i = 0; i < startOffset; i++){
    const blank = document.createElement('div');
    blank.className = 'cal-cell blank';
    grid.appendChild(blank);
  }
  for(let d = 1; d <= daysInMonth; d++){
    const iso = year + '-' + String(month+1).padStart(2,'0') + '-' + String(d).padStart(2,'0');
    const cell = document.createElement('div');
    cell.className = 'cal-cell' + (iso === todayISO() ? ' today' : '');
    const num = document.createElement('div');
    num.className = 'cal-daynum';
    num.textContent = d;
    cell.appendChild(num);

    const dayAssignments = semAssignments.filter(a => a.dueDate === iso);
    if(dayAssignments.length){
      const dots = document.createElement('div');
      dots.className = 'cal-dots';
      dayAssignments.slice(0, 4).forEach(a => {
        const sub = findSubject(a.semIndex, a.subjectId);
        const dot = document.createElement('span');
        dot.className = 'cal-dot' + (a.type === 'group' ? ' ring' : '');
        dot.style.setProperty('--dot-color', sub ? 'var(--' + sub.color + ')' : 'var(--accent)');
        dot.title = (sub ? sub.name + ' — ' : '') + a.title + (a.type === 'group' ? ' (Group)' : ' (Individual)');
        dots.appendChild(dot);
      });
      cell.appendChild(dots);
    }
    grid.appendChild(cell);
  }
  calWrap.appendChild(grid);
  frag.appendChild(calWrap);

  const legend = document.createElement('div');
  legend.className = 'cal-legend';
  legend.innerHTML =
    '<span><span class="cal-dot" style="--dot-color: var(--ink-soft)"></span> Individual</span>' +
    '<span><span class="cal-dot ring" style="--dot-color: var(--ink-soft)"></span> Group</span>';
  frag.appendChild(legend);

  const addToggle = document.createElement('button');
  addToggle.className = 'add-assignment-toggle';
  addToggle.textContent = '+ Add assignment';
  const formHolder = document.createElement('div');
  formHolder.className = 'add-assignment-holder';
  addToggle.addEventListener('click', () => {
    formHolder.classList.toggle('open');
  });
  frag.appendChild(addToggle);

  const form = document.createElement('div');
  form.className = 'add-assignment-form';

  const subjSelect = document.createElement('select');
  subjects.forEach(s => {
    const opt = document.createElement('option');
    opt.value = s.id;
    opt.textContent = s.name;
    subjSelect.appendChild(opt);
  });

  const titleInput = document.createElement('input');
  titleInput.type = 'text';
  titleInput.placeholder = 'Assignment title';
  titleInput.maxLength = 60;

  const dateInput = document.createElement('input');
  dateInput.type = 'date';
  dateInput.value = todayISO();

  const descInput = document.createElement('textarea');
  descInput.className = 'assignment-desc-input';
  descInput.placeholder = 'Add a description (optional) — what needs to be done, requirements, etc.';
  descInput.rows = 3;

  const typeRow = document.createElement('div');
  typeRow.className = 'type-toggle';
  let chosenType = 'individual';
  const indivBtn = document.createElement('button');
  indivBtn.type = 'button';
  indivBtn.className = 'type-pill active';
  indivBtn.textContent = '👤 Individual';
  const groupBtn = document.createElement('button');
  groupBtn.type = 'button';
  groupBtn.className = 'type-pill';
  groupBtn.textContent = '👥 Group';
  indivBtn.addEventListener('click', () => { chosenType = 'individual'; indivBtn.classList.add('active'); groupBtn.classList.remove('active'); });
  groupBtn.addEventListener('click', () => { chosenType = 'group'; groupBtn.classList.add('active'); indivBtn.classList.remove('active'); });
  typeRow.appendChild(indivBtn);
  typeRow.appendChild(groupBtn);

  const submitBtn = document.createElement('button');
  submitBtn.className = 'add-assignment-submit';
  submitBtn.textContent = 'Add';
  submitBtn.addEventListener('click', () => {
    const title = titleInput.value.trim();
    if(!title || !dateInput.value || !subjSelect.value) return;
    data.assignments.push({
      id: uid(),
      semIndex,
      subjectId: subjSelect.value,
      title,
      dueDate: dateInput.value,
      type: chosenType,
      description: descInput.value.trim()
    });
    save();
    titleInput.value = '';
    descInput.value = '';
    render();
  });

  form.appendChild(subjSelect);
  form.appendChild(titleInput);
  form.appendChild(dateInput);
  form.appendChild(descInput);
  form.appendChild(typeRow);
  form.appendChild(submitBtn);
  formHolder.appendChild(form);
  frag.appendChild(formHolder);

  const upcoming = semAssignments.slice().sort((a,b) => a.dueDate.localeCompare(b.dueDate));
  if(upcoming.length === 0){
    const empty = document.createElement('div');
    empty.className = 'empty';
    empty.innerHTML = '<div class="big">Nothing on the calendar</div>Add an assignment above to start tracking due dates.';
    frag.appendChild(empty);
  } else {
    const alist = document.createElement('div');
    alist.className = 'assignment-list';
    upcoming.forEach(a => {
      const sub = findSubject(a.semIndex, a.subjectId);
      const card = document.createElement('div');
      card.className = 'assignment-card';

      const row = document.createElement('div');
      row.className = 'assignment-row';
      const overdue = a.dueDate < todayISO();

      const dot = document.createElement('span');
      dot.className = 'assignment-dot';
      dot.style.background = 'var(--' + (sub ? sub.color : 'accent') + ')';
      row.appendChild(dot);

      const subjEl = document.createElement('span');
      subjEl.className = 'assignment-subject';
      subjEl.textContent = sub ? sub.name : '';
      row.appendChild(subjEl);

      let titleEl;
      if(a.description){
        titleEl = document.createElement('button');
        titleEl.className = 'assignment-title clickable';
        titleEl.textContent = a.title + (assignmentDescExpanded.has(a.id) ? ' ▾' : ' ▸');
        titleEl.addEventListener('click', () => {
          if(assignmentDescExpanded.has(a.id)) assignmentDescExpanded.delete(a.id);
          else assignmentDescExpanded.add(a.id);
          render();
        });
      } else {
        titleEl = document.createElement('span');
        titleEl.className = 'assignment-title';
        titleEl.textContent = a.title;
      }
      row.appendChild(titleEl);

      const badge = document.createElement('span');
      badge.className = 'assignment-badge ' + (a.type === 'group' ? 'badge-group' : 'badge-individual');
      badge.textContent = a.type === 'group' ? '👥 Group' : '👤 Individual';
      row.appendChild(badge);

      const dateEl = document.createElement('span');
      dateEl.className = 'assignment-date' + (overdue ? ' overdue' : '');
      dateEl.textContent = formatDateLabel(a.dueDate);
      row.appendChild(dateEl);

      const delBtn = document.createElement('button');
      delBtn.className = 'assignment-del';
      delBtn.textContent = '×';
      delBtn.setAttribute('aria-label', 'Remove assignment');
      delBtn.addEventListener('click', () => {
        data.assignments = data.assignments.filter(x => x.id !== a.id);
        assignmentDescExpanded.delete(a.id);
        save();
        render();
      });
      row.appendChild(delBtn);

      card.appendChild(row);

      if(a.description && assignmentDescExpanded.has(a.id)){
        const desc = document.createElement('div');
        desc.className = 'assignment-desc';
        desc.textContent = a.description;
        card.appendChild(desc);
      }

      alist.appendChild(card);
    });
    frag.appendChild(alist);
  }

  return frag;
}

load();
</script>
